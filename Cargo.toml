[workspace]
resolver = "2"
members = [
    "libxc", "libxc-ffi",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.2"
description = "libxc FFI bindings and wrappers"
repository = "https://github.com/RESTGroup/libxc-rs"
keywords = ["ffi", "chemistry"]
categories = ["science"]
license = "Apache-2.0"

[workspace.dependencies]
# default-features = false: the api-version features (api-v6_2/v7_0/v7_1) and
# dynamic_loading must be selected exclusively through the `libxc` crate's
# features. Otherwise libxc-ffi's own defaults (api-v7_0 + dynamic_loading)
# are always unified in, and e.g. `--features api-v6_2` would still compile
# the v7.0 struct layout of `xc_func_type` — which reads out of bounds when
# a v6.2.2 shared library is loaded at runtime.
libxc-ffi = { path = "libxc-ffi", version = "0.1.2", default-features = false }
